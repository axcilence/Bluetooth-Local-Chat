<!doctype html>
<html lang="en" class="h-full w-full overflow-hidden">
  <head>
    <script>
      (function() {
        try {
          var _fetchVal;
          try {
            _fetchVal = window.fetch;
          } catch (e) {}

          function enableFetchAssignment(target) {
            if (!target) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || desc.configurable) {
                Object.defineProperty(target, 'fetch', {
                  get: function() { return _fetchVal; },
                  set: function(val) { _fetchVal = val; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
          }

          var curr = window;
          while (curr) {
            enableFetchAssignment(curr);
            curr = Object.getPrototypeOf(curr);
          }
          if (typeof Window !== 'undefined' && Window.prototype) {
            enableFetchAssignment(Window.prototype);
          }
          if (typeof globalThis !== 'undefined') {
            enableFetchAssignment(globalThis);
          }
        } catch (err) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b141a" />
    <link rel="manifest" href="/manifest.json" />
    <title>Bluetooth Offline Local Chat</title>
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-hidden h-full w-full m-0 p-0">
    <div id="root" class="h-full w-full flex flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
